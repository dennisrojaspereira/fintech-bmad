## Story Dependencies & Parallelization

```
Sprint 1 (Foundation)
  ↓
Sprint 2 (Onboarding + Webhooks) — can run in parallel
  ├─ Bank Integration (Stories 2.1-2.4)
  └─ Payment Ingestion (Stories 3.1-3.3)
  ↓
Sprint 3 (Bank Sync + Matching)
  ├─ Bank Sync (Stories 4.1-4.3) — waits for Sprint 2
  └─ Matching (Stories 5.1-5.2) — waits for Sprint 2 + 3
  ↓
Sprint 4 (Dashboard + Conflicts)
  ├─ Conflicts (Stories 5.3-5.4) — waits for 5.1-5.2
  └─ Dashboard (Stories 6.1-6.3) — waits for 5.3
  ↓
Sprint 5 (API + Polish)
  ├─ Dashboard Polish (Story 6.4)
  └─ REST API (Stories 7.1-7.5) — waits for 5.2-5.3
```

---

## Risks & Mitigation

| Risk | Impact | Probability | Mitigation |
|------|--------|-------------|-----------|
| Pluggy API downtime | Blocks Sprint 3+ | Low | Test fallback (polling every 1h if needed) |
| Matching algorithm accuracy < 85% | Core MVP metric at risk | Medium | User testing in Sprint 3; iterate on fuzzy match logic |
| Database performance degradation | Blocks Sprint 4+ | Low | Index early (Sprint 1); monitor query times |
| Webhook delivery failures | Data loss | Low | Implement retry logic + duplicate detection (Sprint 2-3) |
| Scope creep (Cielo, multi-tenant, etc.) | Delays MVP | High | Hold scope to 7 epics; document roadmap for v1.1 |

